<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>יומן ניהול | Miriam Omesi</title>

<!-- ✏️ PWA - מאפשר "התקנה" של הדף כאפליקציה מהדפדפן -->
<link rel="manifest" href="journal-manifest.json">
<meta name="theme-color" content="#B8934F">
<link rel="apple-touch-icon" href="icon-192.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;0,800;1,500&family=Assistant:wght@400;600;700&family=Rubik:wght@600;700&display=swap" rel="stylesheet">

<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/chartjs-plugin-datalabels/2.2.0/chartjs-plugin-datalabels.min.js"></script>

<style>
  :root{
    --gold: #B8934F;
    --gold-light: #D9BD7E;
    --gold-deep: #4E3A10;
    --cream: #F3E9D2;
    --cream-soft: #EFE3C6;
    --text-dark: #4A3A18;
    --text-soft: #6B5A30;
  }
  *{ margin:0; padding:0; box-sizing:border-box; }
  body{
    font-family:'Assistant', sans-serif;
    background: var(--cream);
    color: var(--text-dark);
    min-height:100vh;
    padding: 28px 16px 60px;
  }
  ::-webkit-scrollbar{ width:6px; }
  ::-webkit-scrollbar-thumb{ background: var(--gold); border-radius:10px; }

  .header{ text-align:center; margin-bottom:20px; }
  .logo{
    font-family:'Playfair Display', serif;
    font-style:italic;
    font-weight:600;
    font-size:34px;
    line-height:1.1;
    background: linear-gradient(135deg, var(--gold-deep), var(--gold) 45%, var(--gold-light) 60%, var(--gold) 80%);
    -webkit-background-clip:text;
    background-clip:text;
    -webkit-text-fill-color:transparent;
  }
  .divider{ width:60px; height:2px; background:var(--gold); margin:10px auto; opacity:0.7; }
  .subtitle{ font-size:13px; font-weight:700; color:var(--text-soft); letter-spacing:1px; }

  .tabs{ display:flex; justify-content:center; gap:10px; margin-bottom:18px; }
  .tab-btn{
    font-family:'Rubik', sans-serif;
    font-weight:700;
    font-size:14px;
    padding:9px 22px;
    border-radius:30px;
    border:1.5px solid var(--gold);
    background:transparent;
    color:var(--gold-deep);
    cursor:pointer;
    transition: all .2s ease;
  }
  .tab-btn.active{ background:var(--gold); color:#000; }

  .month-nav{ display:flex; align-items:center; justify-content:center; gap:20px; margin-bottom:16px; }
  .nav-btn{
    width:34px; height:34px; border-radius:50%; border:1.5px solid var(--gold);
    background:transparent; color:var(--gold-deep); font-size:18px; cursor:pointer;
  }
  .month-label{ font-family:'Playfair Display', serif; font-weight:700; font-size:18px; min-width:150px; text-align:center; }

  .card{
    max-width:560px; margin:0 auto 20px; background:rgba(255,255,255,0.5);
    border:1px solid rgba(184,147,79,0.28); border-radius:20px; padding:20px 18px;
    box-shadow:0 8px 30px rgba(154,116,20,0.12);
  }

  .weekdays-row{ display:grid; grid-template-columns:repeat(7,1fr); text-align:center; font-size:11px; font-weight:700; color:var(--text-soft); margin-bottom:6px; }
  .cal-grid{ display:grid; grid-template-columns:repeat(7,1fr); gap:5px; }
  .cal-cell{
    aspect-ratio:1/1; border-radius:10px; border:1px solid rgba(184,147,79,0.18);
    background:rgba(255,255,255,0.4); display:flex; flex-direction:column;
    align-items:center; justify-content:center; cursor:pointer; padding:3px; overflow:hidden;
  }
  .cal-cell:hover{ background: rgba(184,147,79,0.18); }
  .cal-cell.empty{ visibility:hidden; cursor:default; }
  .cal-cell.today{ border-color:var(--gold); box-shadow:0 0 0 1px var(--gold) inset; }
  .cal-cell.filled{ background: rgba(184,147,79,0.14); }
  .day-num{ font-family:'Playfair Display', serif; font-weight:800; font-size:13px; }
  .day-badge{ font-size:8.5px; font-weight:700; color:var(--gold-deep); text-align:center; line-height:1.3; }
  .day-badge-count{ font-size:7px; color:var(--text-soft); font-weight:600; }

  .stats-row{ display:flex; flex-wrap:wrap; gap:10px; max-width:560px; margin:0 auto 20px; }
  .stat-card{ flex:1 1 40%; background:rgba(255,255,255,0.5); border:1px solid rgba(184,147,79,0.28); border-radius:16px; padding:16px 12px; text-align:center; }
  .stat-card.wide{ flex:1 1 100%; }
  .stat-value{ font-family:'Playfair Display', serif; font-weight:800; font-size:26px; color:var(--gold-deep); }
  .stat-label{ font-size:12px; font-weight:700; color:var(--text-soft); margin-top:4px; }

  .chart-title{ font-family:'Playfair Display', serif; font-weight:700; font-size:15px; margin-bottom:10px; text-align:center; }
  .charts-grid{ max-width:560px; margin:0 auto; display:grid; grid-template-columns:1fr; }
  @media (min-width: 620px){
    .charts-grid.two-col{ grid-template-columns:1fr 1fr; gap:16px; }
  }
  .chart-wrap{ position:relative; height:210px; }

  .modal-overlay{
    position:fixed; inset:0; background:rgba(20,15,5,0.55); backdrop-filter:blur(3px);
    display:none; align-items:flex-start; justify-content:center; z-index:2000;
    padding:30px 16px; overflow-y:auto;
  }
  .modal-overlay.show{ display:flex; }
  .modal-card{
    position:relative; max-width:440px; width:100%; background:rgba(251,246,234,0.98);
    border:1px solid rgba(184,147,79,0.35); border-radius:22px; padding:30px 22px 24px;
    box-shadow:0 20px 60px rgba(0,0,0,0.35);
  }
  .modal-close{ position:absolute; top:14px; left:14px; background:none; border:none; font-size:18px; color:var(--text-soft); cursor:pointer; }
  .modal-title{ font-family:'Playfair Display', serif; font-weight:700; font-size:18px; text-align:center; margin-bottom:10px; }
  .modal-summary{
    background:rgba(184,147,79,0.1); border:1px solid rgba(184,147,79,0.25); border-radius:12px;
    padding:8px 12px; text-align:center; font-size:13px; font-weight:700; color:var(--gold-deep); margin-bottom:14px;
  }
  .entry-list{ margin-bottom:18px; }
  .empty-note{ color:var(--text-soft); font-size:13px; text-align:center; padding:8px 0; }
  .entry-row{
    display:flex; justify-content:space-between; align-items:center;
    background:rgba(184,147,79,0.08); border:1px solid rgba(184,147,79,0.22);
    border-radius:12px; padding:9px 12px; margin-bottom:7px;
  }
  .entry-name{ font-weight:700; font-size:14px; }
  .entry-meta{ font-size:12px; color:var(--text-soft); margin-top:2px; }
  .delete-btn{ background:none; border:none; color:#7A2E14; font-size:12px; font-weight:700; cursor:pointer; }

  .form-label{ font-family:'Playfair Display', serif; font-weight:700; font-size:14px; margin-bottom:8px; }
  input{
    width:100%; padding:11px 14px; border-radius:12px; border:1.5px solid rgba(184,147,79,0.4);
    background:rgba(255,255,255,0.7); color:var(--text-dark); font-family:'Assistant', sans-serif;
    font-weight:600; font-size:14px; outline:none; margin-bottom:10px;
  }
  input:focus{ border-color:var(--gold); }
  .form-error{ color:#7A2E14; font-size:12px; font-weight:700; margin-bottom:8px; text-align:center; }
  .add-btn{
    width:100%; background:var(--gold); color:#000; border:none; font-weight:700;
    font-size:14px; padding:12px 20px; border-radius:30px; cursor:pointer;
  }
  .add-btn:hover{ background: var(--gold-light); }

  /* ✏️ באנר התקנה - מוצג רק אם הדפדפן תומך ומאפשר "התקנה כאפליקציה" */
  .install-banner{
    display:none; max-width:560px; margin:0 auto 18px; background:rgba(184,147,79,0.12);
    border:1px solid var(--gold); border-radius:14px; padding:12px 16px;
    align-items:center; justify-content:space-between; gap:10px; font-size:13px; font-weight:700;
  }
  .install-banner.show{ display:flex; }
  .install-btn{
    background:var(--gold); color:#000; border:none; border-radius:20px; padding:8px 16px;
    font-weight:700; font-size:13px; cursor:pointer; white-space:nowrap;
  }
</style>
</head>
<body>

<div id="loginScreen" class="card" style="max-width:340px; margin:15vh auto 0; text-align:center;">
  <div class="logo" style="margin-bottom:6px;">Miriam<br>Omesi</div>
  <div class="subtitle" style="margin-bottom:18px;">כניסה ליומן הניהול</div>
  <div class="field-label" style="font-family:'Playfair Display',serif; font-weight:700; font-size:14px; margin-bottom:8px;">סיסמה</div>
  <input type="password" id="passwordInput" placeholder="הזיני סיסמה">
  <button class="add-btn" onclick="login()">כניסה</button>
  <div id="loginStatus" class="form-error" style="display:none;"></div>
</div>

<div id="appScreen" style="display:none;">

<div class="header">
  <div class="logo">Miriam<br>Omesi</div>
  <div class="divider"></div>
  <div class="subtitle">יומן ניהול קליניקה</div>
</div>

<div id="installBanner" class="install-banner">
  <span>אפשר להתקין את היומן כאפליקציה במסך הבית 📲</span>
  <button class="install-btn" id="installBtn">התקנה</button>
</div>

<div class="tabs">
  <button class="tab-btn active" id="tabCalendar" onclick="switchView('calendar')">יומן</button>
  <button class="tab-btn" id="tabStats" onclick="switchView('stats')">סטטיסטיקות</button>
</div>

<div class="month-nav">
  <button class="nav-btn" onclick="changeMonth(-1)">‹</button>
  <div class="month-label" id="monthLabel"></div>
  <button class="nav-btn" onclick="changeMonth(1)">›</button>
</div>

<div id="viewCalendar">
  <div class="card">
    <div class="weekdays-row">
      <span>א</span><span>ב</span><span>ג</span><span>ד</span><span>ה</span><span>ו</span><span>ש</span>
    </div>
    <div class="cal-grid" id="calGrid"></div>
  </div>
</div>

<div id="viewStats" style="display:none;">

  <!-- ✏️ מבט שנתי - הכנסה בכל חודש לאורך השנה, כדי לראות הכל מול העיניים -->
  <div class="card">
    <div class="month-nav" style="margin-bottom:12px;">
      <button class="nav-btn" onclick="changeStatsYear(-1)">‹</button>
      <div class="month-label" id="statsYearLabel"></div>
      <button class="nav-btn" onclick="changeStatsYear(1)">›</button>
    </div>
    <div class="chart-title">הכנסה חודשית לאורך השנה</div>
    <div class="chart-wrap"><canvas id="yearlyChart"></canvas></div>
  </div>

  <div class="stats-row">
    <div class="stat-card"><div class="stat-value" id="statClients">0</div><div class="stat-label">ביקורים החודש</div></div>
    <div class="stat-card"><div class="stat-value" id="statNew">0</div><div class="stat-label">לקוחות חדשות</div></div>
    <div class="stat-card"><div class="stat-value" id="statReturning">0</div><div class="stat-label">לקוחות חוזרות</div></div>
    <div class="stat-card wide"><div class="stat-value" id="statRevenue">₪0</div><div class="stat-label">הכנסה חודשית</div></div>
  </div>

  <div class="card">
    <div class="chart-title">הכנסה יומית</div>
    <div class="chart-wrap"><canvas id="dailyChart"></canvas></div>
  </div>

  <div class="charts-grid two-col">
    <div class="card">
      <div class="chart-title">חדשות מול חוזרות</div>
      <div class="chart-wrap"><canvas id="pieChart"></canvas></div>
    </div>
    <div class="card">
      <div class="chart-title">הכנסה לפי סוג טיפול</div>
      <div class="chart-wrap"><canvas id="treatmentChart"></canvas></div>
    </div>
  </div>
</div>

<!-- חלונית יום -->
<div id="dayModal" class="modal-overlay" onclick="if(event.target===this) closeDayModal()">
  <div class="modal-card">
    <button class="modal-close" onclick="closeDayModal()">✕</button>
    <div class="modal-title" id="modalTitle"></div>
    <div id="modalSummary" class="modal-summary" style="display:none;"></div>
    <div id="entryList" class="entry-list"></div>

    <div class="form-label">הוספת לקוחה</div>
    <input type="text" id="formName" placeholder="שם הלקוחה">
    <input type="text" id="formTreatment" placeholder="סוג טיפול (למשל: לק ג'ל)" list="treatmentSuggestions">
    <datalist id="treatmentSuggestions">
      <option value="לק ג'ל"></option>
      <option value="גבות"></option>
      <option value="פדיקור רפואי"></option>
      <option value="ריסים"></option>
      <option value="טיפול פנים"></option>
    </datalist>
    <input type="number" id="formAmount" placeholder="סכום ששולם (₪)">
    <div id="formError" class="form-error" style="display:none;"></div>
    <button class="add-btn" onclick="addEntry()">+ הוספת רשומה</button>
  </div>
</div>

</div>
<!-- סוף appScreen -->

<script>
  const COLORS = { gold:'#B8934F', goldLight:'#D9BD7E', goldDeep:'#4E3A10', creamSoft:'#EFE3C6', textSoft:'#6B5A30' };
  // ✏️ פלטת גוונים למשפחת הזהב - כל סוג טיפול בגרף מקבל צבע אחר מתוך הרשימה הזו (חוזר על עצמו אם יש הרבה סוגים)
  const TREATMENT_PALETTE = ['#4E3A10', '#B8934F', '#8A6B2C', '#D9BD7E', '#6B5A30', '#A67C3D', '#7A5F1F', '#C9A868'];
  const HEBREW_MONTHS = ['ינואר','פברואר','מרץ','אפריל','מאי','יוני','יולי','אוגוסט','ספטמבר','אוקטובר','נובמבר','דצמבר'];

  // ✏️ הדביקי כאן את כתובת ה-Web App שקיבלת מ-JournalCode.gs אחרי הפריסה
  const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbw5r5yjzt8jwy0A5QhNiLN1s1bmegBeDiiTUpVr59xpmL_gbWwD5a_0qUjcDMHkVHP-/exec';

  // ✏️ רושמים את התוסף שמציג מספרים ישירות על העמודות בגרף (רק במקומות שנבקש זאת בפירוש)
  if(typeof ChartDataLabels !== 'undefined') Chart.register(ChartDataLabels);

  let journalPassword = '';

  function pad2(n){ return n < 10 ? '0'+n : ''+n; }
  function dateKey(y,m,d){ return `${y}-${pad2(m)}-${pad2(d)}`; }

  async function login(){
    const pwd = document.getElementById('passwordInput').value;
    const statusEl = document.getElementById('loginStatus');
    statusEl.style.display = 'none';

    try{
      const res = await fetch(`${APPS_SCRIPT_URL}?action=getEntries&password=${encodeURIComponent(pwd)}`);
      const data = await res.json();

      if(!data.success){
        statusEl.textContent = data.error || 'סיסמה שגויה';
        statusEl.style.display = 'block';
        return;
      }

      journalPassword = pwd;
      entries = data.entries || [];
      document.getElementById('loginScreen').style.display = 'none';
      document.getElementById('appScreen').style.display = 'block';
      render();

    }catch(err){
      statusEl.textContent = 'אירעה שגיאה, נסי שוב';
      statusEl.style.display = 'block';
    }
  }

  // ✏️ שולפת מחדש את כל הרשומות מהגיליון - קוראים לזה אחרי כל הוספה/מחיקה כדי להישאר מסונכרנים
  async function refreshEntries(){
    try{
      const res = await fetch(`${APPS_SCRIPT_URL}?action=getEntries&password=${encodeURIComponent(journalPassword)}`);
      const data = await res.json();
      if(data.success) entries = data.entries || [];
    }catch(err){ /* אם זה נכשל, פשוט ממשיכים עם הנתונים הקיימים בזיכרון */ }
  }

  let entries = [];
  const today = new Date();
  let calYear = today.getFullYear();
  let calMonth = today.getMonth() + 1;
  let selectedDate = null;
  let currentView = 'calendar';

  let dailyChartInstance = null, pieChartInstance = null, treatmentChartInstance = null, yearlyChartInstance = null;
  let statsYear = today.getFullYear();

  function entriesByDate(){
    const map = {};
    entries.forEach(e => { (map[e.date] = map[e.date] || []).push(e); });
    return map;
  }

  function firstEntryByClient(){
    const map = {};
    entries.forEach(e => {
      const key = e.name.trim().toLowerCase();
      if(!key) return;
      const current = map[key];
      if(!current || e.date < current.date || (e.date === current.date && e.id < current.id)){
        map[key] = e;
      }
    });
    return map;
  }

  function switchView(view){
    currentView = view;
    if(view === 'stats') statsYear = calYear; // מתחילים את המבט השנתי מהשנה שאת כרגע צופה בה
    document.getElementById('tabCalendar').classList.toggle('active', view === 'calendar');
    document.getElementById('tabStats').classList.toggle('active', view === 'stats');
    document.getElementById('viewCalendar').style.display = view === 'calendar' ? 'block' : 'none';
    document.getElementById('viewStats').style.display = view === 'stats' ? 'block' : 'none';
    render();
  }

  function changeMonth(delta){
    calMonth += delta;
    if(calMonth < 1){ calMonth = 12; calYear--; }
    if(calMonth > 12){ calMonth = 1; calYear++; }
    render();
  }

  function changeStatsYear(delta){
    statsYear += delta;
    renderStats();
  }

  function render(){
    document.getElementById('monthLabel').textContent = `${HEBREW_MONTHS[calMonth-1]} ${calYear}`;
    if(currentView === 'calendar') renderCalendar();
    else renderStats();
  }

  function renderCalendar(){
    const grid = document.getElementById('calGrid');
    grid.innerHTML = '';
    const byDate = entriesByDate();
    const firstWeekday = new Date(calYear, calMonth-1, 1).getDay();
    const daysInMonth = new Date(calYear, calMonth, 0).getDate();
    const todayKey = dateKey(today.getFullYear(), today.getMonth()+1, today.getDate());

    for(let i=0; i<firstWeekday; i++){
      const empty = document.createElement('div');
      empty.className = 'cal-cell empty';
      grid.appendChild(empty);
    }
    for(let d=1; d<=daysInMonth; d++){
      const key = dateKey(calYear, calMonth, d);
      const dayEntries = byDate[key] || [];
      const dayTotal = dayEntries.reduce((s,e) => s + (Number(e.amount)||0), 0);

      const cell = document.createElement('div');
      cell.className = 'cal-cell' + (key===todayKey ? ' today' : '') + (dayEntries.length ? ' filled' : '');
      cell.onclick = () => openDayModal(key);

      const num = document.createElement('div');
      num.className = 'day-num';
      num.textContent = d;
      cell.appendChild(num);

      if(dayEntries.length){
        const badge = document.createElement('div');
        badge.className = 'day-badge';
        badge.innerHTML = `<div>₪${dayTotal}</div><div class="day-badge-count">${dayEntries.length} לקוחות</div>`;
        cell.appendChild(badge);
      }
      grid.appendChild(cell);
    }
  }

  function computeMonthStats(){
    const monthKeyStr = `${calYear}-${pad2(calMonth)}`;
    const monthEntries = entries.filter(e => e.date.startsWith(monthKeyStr));
    const firstEntries = firstEntryByClient();

    let newCount = 0, returningCount = 0;
    const uniqueClients = {};
    monthEntries.forEach(e => {
      const key = e.name.trim().toLowerCase();
      if(key) uniqueClients[key] = true;
      const first = firstEntries[key];
      if(first && first.id === e.id) newCount++; // זו הפעם הראשונה אי-פעם של הלקוחה הזו
      else returningCount++; // כבר הייתה לפני (גם אם קודם באותו חודש)
    });
    const revenue = monthEntries.reduce((s,e) => s + (Number(e.amount)||0), 0);

    return { monthEntries, totalClients: Object.keys(uniqueClients).length, totalVisits: monthEntries.length, newCount, returningCount, revenue };
  }

  function renderStats(){
    const { monthEntries, totalVisits, newCount, returningCount, revenue } = computeMonthStats();

    document.getElementById('statClients').textContent = totalVisits;
    document.getElementById('statNew').textContent = newCount;
    document.getElementById('statReturning').textContent = returningCount;
    document.getElementById('statRevenue').textContent = '₪' + revenue.toLocaleString();

    // ✏️ גרף שנתי - הכנסה בכל אחד מ-12 החודשים של השנה הנבחרת, מול העיניים בבת אחת
    document.getElementById('statsYearLabel').textContent = statsYear;
    const yearlyLabels = HEBREW_MONTHS.map(m => m.slice(0,3));
    const yearlyData = [];
    for(let m=1; m<=12; m++){
      const monthPrefix = `${statsYear}-${pad2(m)}`;
      const total = entries
        .filter(e => e.date.startsWith(monthPrefix))
        .reduce((s,e) => s + (Number(e.amount)||0), 0);
      yearlyData.push(total);
    }
    if(yearlyChartInstance) yearlyChartInstance.destroy();
    yearlyChartInstance = new Chart(document.getElementById('yearlyChart'), {
      type: 'bar',
      data: { labels: yearlyLabels, datasets: [{ label:'הכנסה', data: yearlyData, backgroundColor: COLORS.goldDeep, borderRadius: 6 }] },
      options: {
        responsive:true, maintainAspectRatio:false,
        plugins:{
          legend:{ display:false },
          tooltip:{ callbacks:{ label: (ctx) => '₪' + ctx.parsed.y.toLocaleString() } },
          datalabels:{ display:false }
        },
        scales:{
          x:{ grid:{ display:false }, ticks:{ color: COLORS.textSoft, font:{ family:'Assistant', size:10 } } },
          y:{ grid:{ color: COLORS.creamSoft }, ticks:{ color: COLORS.textSoft, font:{ family:'Assistant', size:10 } } }
        }
      }
    });

    // גרף הכנסה יומית
    const daysInMonth = new Date(calYear, calMonth, 0).getDate();
    const byDate = entriesByDate();
    const dailyLabels = [], dailyData = [];
    for(let d=1; d<=daysInMonth; d++){
      const key = dateKey(calYear, calMonth, d);
      dailyLabels.push(d);
      dailyData.push((byDate[key]||[]).reduce((s,e) => s + (Number(e.amount)||0), 0));
    }

    if(dailyChartInstance) dailyChartInstance.destroy();
    dailyChartInstance = new Chart(document.getElementById('dailyChart'), {
      type: 'bar',
      data: { labels: dailyLabels, datasets: [{ label:'הכנסה', data: dailyData, backgroundColor: COLORS.gold, borderRadius: 6 }] },
      options: {
        responsive:true, maintainAspectRatio:false,
        plugins:{ legend:{ display:false }, datalabels:{ display:false } },
        scales:{
          x:{ grid:{ display:false }, ticks:{ color: COLORS.textSoft, font:{ family:'Assistant', size:10 } } },
          y:{ grid:{ color: COLORS.creamSoft }, ticks:{ color: COLORS.textSoft, font:{ family:'Assistant', size:10 } } }
        }
      }
    });

    // גרף חדשות מול חוזרות
    if(pieChartInstance) pieChartInstance.destroy();
    pieChartInstance = new Chart(document.getElementById('pieChart'), {
      type: 'doughnut',
      data: {
        labels: ['חוזרות','חדשות'],
        datasets: [{ data:[returningCount, newCount], backgroundColor:[COLORS.gold, COLORS.goldLight] }]
      },
      options: {
        responsive:true, maintainAspectRatio:false,
        plugins:{ legend:{ position:'bottom', labels:{ font:{ family:'Assistant', size:12 } } }, datalabels:{ display:false } }
      }
    });

    // גרף הכנסה לפי טיפול
    const treatmentMap = {};
    monthEntries.forEach(e => {
      const t = (e.treatment || '').trim() || 'ללא ציון';
      treatmentMap[t] = (treatmentMap[t]||0) + (Number(e.amount)||0);
    });
    const treatmentLabels = Object.keys(treatmentMap);
    const treatmentData = Object.values(treatmentMap);

    if(treatmentChartInstance) treatmentChartInstance.destroy();
    treatmentChartInstance = new Chart(document.getElementById('treatmentChart'), {
      type: 'bar',
      data: {
        labels: treatmentLabels,
        datasets: [{
          label:'הכנסה',
          data: treatmentData,
          backgroundColor: treatmentLabels.map((_, i) => TREATMENT_PALETTE[i % TREATMENT_PALETTE.length]),
          borderRadius: 6
        }]
      },
      options: {
        indexAxis: 'y',
        responsive:true, maintainAspectRatio:false,
        layout:{ padding:{ left:0, right:36 } }, /* ✏️ מקום פנוי בקצה כדי שהסכום לא ייחתך */
        plugins:{
          legend:{ display:false },
          datalabels:{
            anchor:'end',
            align:'right',
            color: COLORS.goldDeep,
            font:{ family:'Assistant', weight:700, size:12 },
            formatter: (value) => '₪' + value.toLocaleString()
          }
        },
        scales:{
          x:{ grid:{ color: COLORS.creamSoft }, ticks:{ color: COLORS.textSoft, font:{ family:'Assistant', size:10 } } },
          y:{ grid:{ display:false }, ticks:{ color: COLORS.textSoft, font:{ family:'Assistant', size:11 } } }
        }
      }
    });
  }

  function openDayModal(key){
    selectedDate = key;
    document.getElementById('formName').value = '';
    document.getElementById('formTreatment').value = '';
    document.getElementById('formAmount').value = '';
    document.getElementById('formError').style.display = 'none';

    const dateObj = new Date(key + 'T12:00:00');
    document.getElementById('modalTitle').textContent = dateObj.toLocaleDateString('he-IL', { weekday:'long', day:'numeric', month:'long', year:'numeric' });

    renderDayEntries();
    document.getElementById('dayModal').classList.add('show');
  }

  function closeDayModal(){
    document.getElementById('dayModal').classList.remove('show');
    render();
  }

  function renderDayEntries(){
    const byDate = entriesByDate();
    const dayEntries = byDate[selectedDate] || [];
    const total = dayEntries.reduce((s,e) => s + (Number(e.amount)||0), 0);

    const summaryEl = document.getElementById('modalSummary');
    if(dayEntries.length){
      summaryEl.style.display = 'block';
      summaryEl.textContent = `סה"כ ליום: ₪${total} · ${dayEntries.length} לקוחות`;
    } else {
      summaryEl.style.display = 'none';
    }

    const listEl = document.getElementById('entryList');
    listEl.innerHTML = '';
    if(!dayEntries.length){
      listEl.innerHTML = '<div class="empty-note">אין רשומות ליום זה עדיין</div>';
      return;
    }
    dayEntries.forEach(e => {
      const row = document.createElement('div');
      row.className = 'entry-row';
      row.innerHTML = `
        <div>
          <div class="entry-name">${escapeHtml(e.name)}</div>
          <div class="entry-meta">${escapeHtml(e.treatment)} · ₪${e.amount}</div>
        </div>
      `;
      const delBtn = document.createElement('button');
      delBtn.className = 'delete-btn';
      delBtn.textContent = 'מחיקה';
      delBtn.onclick = () => deleteEntry(e.id);
      row.appendChild(delBtn);
      listEl.appendChild(row);
    });
  }

  async function addEntry(){
    const name = document.getElementById('formName').value.trim();
    const treatment = document.getElementById('formTreatment').value.trim();
    const amount = parseFloat(document.getElementById('formAmount').value);
    const errorEl = document.getElementById('formError');

    if(!name || !treatment || isNaN(amount) || amount < 0){
      errorEl.textContent = 'נא למלא שם, סוג טיפול, וסכום תקין';
      errorEl.style.display = 'block';
      return;
    }
    errorEl.style.display = 'none';

    try{
      const res = await fetch(APPS_SCRIPT_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({
          action: 'addEntry',
          password: journalPassword,
          date: selectedDate, name, treatment, amount
        })
      });
      const data = await res.json();
      if(!data.success){
        errorEl.textContent = data.error || 'שגיאה בשמירה, נסי שוב';
        errorEl.style.display = 'block';
        return;
      }

      await refreshEntries();
      document.getElementById('formName').value = '';
      document.getElementById('formTreatment').value = '';
      document.getElementById('formAmount').value = '';
      renderDayEntries();

    }catch(err){
      errorEl.textContent = 'שגיאה בשמירה, נסי שוב';
      errorEl.style.display = 'block';
    }
  }

  async function deleteEntry(id){
    try{
      const res = await fetch(APPS_SCRIPT_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({ action: 'deleteEntry', password: journalPassword, id })
      });
      const data = await res.json();
      if(!data.success) return;

      await refreshEntries();
      renderDayEntries();

    }catch(err){ /* אם המחיקה נכשלת, הרשומה פשוט תישאר - אפשר לנסות שוב */ }
  }

  function escapeHtml(str){
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }

  // ✏️ רישום Service Worker - נדרש כדי שהדפדפן יאפשר "התקנה" של הדף כאפליקציה
  if('serviceWorker' in navigator){
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('journal-sw.js').catch(() => {});
    });
  }

  // ✏️ באנר התקנה מותאם אישית (מוצג רק אם הדפדפן תומך - בעיקר כרום/אנדרואיד)
  let deferredInstallPrompt = null;
  window.addEventListener('beforeinstallprompt', (e) => {
    e.preventDefault();
    deferredInstallPrompt = e;
    document.getElementById('installBanner').classList.add('show');
  });
  document.getElementById('installBtn').addEventListener('click', async () => {
    if(!deferredInstallPrompt) return;
    deferredInstallPrompt.prompt();
    await deferredInstallPrompt.userChoice;
    deferredInstallPrompt = null;
    document.getElementById('installBanner').classList.remove('show');
  });
</script>

</body>
</html>
